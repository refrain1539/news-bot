# =========================================================
# news-bot 設定ファイル
# ユーザーが編集する唯一のファイルです。
# =========================================================

# ---------------------------------------------------------
# レーン(通知枠)
# ---------------------------------------------------------
# スコアはレーン内でしか比較しません。総合レーンとテックレーンを1つのプールに
# 混ぜると、curated_yahoo / curated_livedoor の項が定義上いつも0になるテック記事は
# 構造的に1本も選ばれません。そのため枠(quota)を固定で分けています。
#
# quota    ... そのレーンから通知する最大本数
# min_score... この点数未満のトピックは、枠が余っていても通知しない
#              (穴埋めのために質の低い記事を入れない)
# weights  ... スコアの重み。キーの意味は下記のとおり:
#                curated_*    : 対応する signal を持つソースに載っていれば加点
#                outlet_count : (報じた媒体数 - 1) に対する係数
#                hatena       : log10(はてブ数 + 1) に対する係数
lanes:
  - id: general
    label: 総合
    # 要約を読んで済ませることが多いため、見出しだけ眺める前提の6本から
    # 10本に増やしている。候補は毎日80件前後あるので枯れる心配はない。
    quota: 10
    min_score: 1.0
    weights:
      curated_yahoo: 3.0
      curated_livedoor: 2.0
      outlet_count: 1.0
      hatena: 1.5
      jiji_ranking: 0.5

  - id: tech
    label: テック・科学
    quota: 4
    min_score: 1.0
    # テックレーンには Yahoo!トピックス相当の人手キュレーションが存在しないため、
    # 報道媒体数とはてブ件数の比重を上げています。
    weights:
      outlet_count: 1.5
      hatena: 2.5

# あるレーンで quota が埋まらなかったとき、余った枠をもう一方のレーンに回すか。
# false の場合は本数を減らしてそのまま通知します(推奨)。
spill_over: false

# 要約を作れるトピックだけを通知するか。
#
# true にすると、リード文が取れなかったトピックは、スコアがどれだけ高くても
# 通知しません。「見出しだけ並んでいても読まない。要約が読めるものの中から
# 人気のものを出してほしい」という運用方針に合わせた設定です。
#
# 失うものもあります。2026-09-01 の実データでは、Yahoo!トピックス採用の
# 「住宅ローン変動金利 2行引き上げ」(score 4.00)のように、重要だが元記事が
# カテゴリ別RSSの50件枠から流れてしまってリード文を借りられなかったトピックが
# 落ちます。代わりに下位の要約可能なトピックが繰り上がるため、9〜10番目は
# やや軽い話題になります。
#
# 枠が埋まるかは確認済みです(同日実測: 総合の候補45件のうちリード文ありが
# 29件、テックは50件中50件)。false にすると従来どおり、要約の有無は
# 同点時の優先順位にしか影響しなくなります。
require_lead: true

# ---------------------------------------------------------
# ニュースソース
# ---------------------------------------------------------
# format:
#   rss ... RSS 2.0 (<channel><item>, <pubDate>)
#   rdf ... RSS 1.0 / RDF (<item rdf:about>, <dc:date>)
# signal:
#   スコアの weights のキーに対応。null ならスコアに直接は寄与せず、
#   名寄せと媒体数のカウントにのみ使われる。
# representative_ok:
#   false のソースは通知の代表記事に選ばれない。Google ニュースの URL は
#   news.google.com のリダイレクトで、リンク先として見苦しく、はてブ件数も
#   元記事と一致しないため false にしている。
# strip_source_suffix:
#   true なら、タイトル末尾の「 - 媒体名」を切り出して outlet に格納する。
#   Google ニュースのタイトルはこの形式になっている。
sources:
  # ---- 総合レーン ----
  - id: yahoo_topics
    label: Yahoo!トピックス
    lane: general
    url: https://news.yahoo.co.jp/rss/topics/top-picks.xml
    format: rss
    signal: curated_yahoo
    # 見出しのみでリード文を持たない。他社記事と名寄せしてリード文を借りる。

  - id: livedoor_topics
    label: livedoorトピックス
    lane: general
    url: https://news.livedoor.com/topics/rss/top.xml
    format: rss
    signal: curated_livedoor

  # Yahoo!ニュースのカテゴリ別 RSS。**総合レーンで唯一のまとまったリード文の
  # 供給源**なので外さないこと。Yahoo!トピックスは見出しだけ、朝日・時事・
  # Google は description が空(または記事リンクの羅列)で、これを入れる前は
  # 総合レーンでリード文を持つ記事が livedoor の11本しか無く、通知の大半が
  # 「要約なし」になっていた。
  #
  # さらに、Yahoo!トピックスと同じ記事プールなので名寄せで繋がりやすく、
  # トピックスの13文字見出しにリード文を供給する役目も果たす。
  # タイトルは「見出し(産経新聞)」の形式で実際の配信元を含むため、
  # strip_paren_suffix で媒体名を取り出す(これをしないと Yahoo 経由の記事が
  # すべて1媒体と数えられ、outlet_count 項が機能しない)。
  - id: yahoo_domestic
    label: Yahoo!ニュース
    lane: general
    url: https://news.yahoo.co.jp/rss/categories/domestic.xml
    format: rss
    signal: null
    strip_paren_suffix: true

  - id: yahoo_world
    label: Yahoo!ニュース
    lane: general
    url: https://news.yahoo.co.jp/rss/categories/world.xml
    format: rss
    signal: null
    strip_paren_suffix: true

  - id: yahoo_business
    label: Yahoo!ニュース
    lane: general
    url: https://news.yahoo.co.jp/rss/categories/business.xml
    format: rss
    signal: null
    strip_paren_suffix: true

  # スポーツ・芸能は配信ジャンルとして選ばれていないが、Yahoo!トピックス
  # 「主要」にはこれらの話題も入る(訃報・日本代表戦など)。その場合トピックスは
  # 13文字の見出ししか持たないため、リード文を借りる相手が必要になる。
  # lead_only: true にすることで、これらの記事だけで構成されたトピックは
  # 通知候補から外し(rank.py)、「トピックスが拾った話題にリード文を供給する」
  # 役目だけを担わせる。これを入れる前は「バレー女子が帰国 会見で主将謝罪」の
  # ようなトピックが要約なしで通知されていた。
  - id: yahoo_sports
    label: Yahoo!ニュース
    lane: general
    url: https://news.yahoo.co.jp/rss/categories/sports.xml
    format: rss
    signal: null
    strip_paren_suffix: true
    lead_only: true

  - id: yahoo_entertainment
    label: Yahoo!ニュース
    lane: general
    url: https://news.yahoo.co.jp/rss/categories/entertainment.xml
    format: rss
    signal: null
    strip_paren_suffix: true
    lead_only: true

  # 朝日は 2026-09-01 時点で <description> が空のまま配信されている。
  # リード文の供給源にはならないが、見出しと URL は正しく取れるので
  # 「何社が報じたか」の計数と名寄せのために残している。
  - id: asahi
    label: 朝日新聞
    lane: general
    url: https://www.asahi.com/rss/asahi/newsheadlines.rdf
    format: rdf
    signal: null

  - id: jiji_ranking
    label: 時事通信
    lane: general
    url: https://www.jiji.com/rss/ranking.rdf
    format: rdf
    signal: jiji_ranking

  - id: google_top
    label: Googleニュース
    lane: general
    url: https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja
    format: rss
    signal: null
    representative_ok: false
    strip_source_suffix: true

  # ---- テック・科学レーン ----
  - id: itmedia
    label: ITmedia
    lane: tech
    url: https://rss.itmedia.co.jp/rss/2.0/itmedia_all.xml
    format: rss
    signal: null
    # ITmedia の見出しは「[ITmedia News] 本文…」のように媒体名の角括弧が
    # 前置される。通知の見た目が悪いだけでなく、全記事に共通する文字列が
    # 入ることで名寄せの類似度を底上げしてしまうため取り除く。
    strip_bracket_prefix: true

  - id: impress
    label: Impress Watch
    lane: tech
    url: https://www.watch.impress.co.jp/data/rss/1.0/ipw/feed.rdf
    format: rdf
    signal: null

  - id: gigazine
    label: GIGAZINE
    lane: tech
    url: https://gigazine.net/news/rss_2.0/
    format: rss
    signal: null

  # テックレーン側のリード文供給源かつ「オピニオン記事ではないニュース」の供給源。
  # ITmedia/GIGAZINE は解説記事やコラムが多く、はてブ数で選ぶと読み物寄りに
  # 偏るため、報道寄りの記事が入る経路として追加している。
  - id: yahoo_it
    label: Yahoo!ニュース
    lane: tech
    url: https://news.yahoo.co.jp/rss/categories/it.xml
    format: rss
    signal: null
    strip_paren_suffix: true

  - id: yahoo_science
    label: Yahoo!ニュース
    lane: tech
    url: https://news.yahoo.co.jp/rss/categories/science.xml
    format: rss
    signal: null
    strip_paren_suffix: true

  - id: google_tech
    label: Googleニュース
    lane: tech
    url: https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ja&gl=JP&ceid=JP:ja
    format: rss
    signal: null
    representative_ok: false
    strip_source_suffix: true

# 採用しなかったソースと理由(再検討時の判断材料として残す):
#   NHK 公式 RSS (www3.nhk.or.jp/rss/news/cat*.xml)
#     2026-08-30 時点で全カテゴリの最新記事が3週間前で止まっており、更新されていない。
#   EurekAlert 日本語版 (jp.eurekalert.org/rss.xml)
#     配信停止。item が0件。
#   Google ニュース SCIENCE セクション
#     最新記事が4日前で、日次の新着ボットには鮮度が足りない。
#   NewsAPI.org
#     無料枠は24時間遅延かつ開発用途限定で、新着通知に使えない。
#   各社サイトのスクレイピング
#     利用規約と著作権の両面でリスクがあるため採用しない。

# ---------------------------------------------------------
# 取得・名寄せ
# ---------------------------------------------------------
# 何時間前までに配信された記事を対象にするか。
# 毎朝7:00 JST 実行で、前日の早朝以降をカバーする想定。
# pubDate を持たない記事は「今」の配信とみなして常に対象に含める。
lookback_hours: 30

# ---------------------------------------------------------
# 記事の蓄積(article cache)
# ---------------------------------------------------------
# RSS は「直近N件」のスライディングウィンドウで、1回の取得で見えるのは
# 数時間分しかありません。2026-09-01 の実測:
#
#   Yahoo!トピックス     8件 =  1.9時間分   ← スコア最大の重み(3.0)
#   Yahoo!ニュース 経済  50件 =  4.1時間分   ← リード文の供給源
#   Yahoo!ニュース 国内  50件 =  5.5時間分
#   Yahoo!ニュース エンタメ 50件 = 1.6時間分
#
# つまり朝1回だけ実行すると、その日の主要ニュースの2割弱しか候補にできません。
# 「住宅ローン変動金利 2行引き上げ」が要約なしで通知されたのも、発表から
# 数時間で経済カテゴリの窓から流れ、リード文を持つ記事を拾えなかったためです。
#
# これを避けるため、.github/workflows/collect.yml が3時間おきに記事だけを
# 集めて data/article_cache.jsonl に貯め、朝の本番実行はその蓄積分と
# 当日ぶんを合わせて処理します。通知は朝の1回だけで、収集は通知しません。
#
# キャッシュに載せるのは published を持つ記事だけです(TTL の判定に使うため)。
# 日付を持たない記事は毎回の取得ぶんからそのまま流れ込みます。
#
# ttl は lookback_hours より長くしてください。短いと、まだ通知対象の時間帯に
# ある記事がキャッシュから消えてしまいます。
cache_ttl_hours: 36

# 名寄せの閾値。タイトルを正規化した文字 bigram 集合の
# 重なり係数(Szymkiewicz-Simpson, |A∩B| / min(|A|,|B|))がこの値以上なら
# 同一話題とみなす。上げると名寄せが起きにくくなり、下げると無関係な話題まで
# 1つにまとめられる。
#
# Jaccard ではなく重なり係数を使っているのは、Yahoo!トピックスの見出しが
# 13〜16字に固定されている(13文字ルール)のに対し他社は23〜54字あり、
# Jaccard では正解ペアでも構造的に閾値へ届かないためです。詳細は
# src/cluster.py の overlap_coefficient() のコメントを参照してください。
#
# 2026-08-31 の実データでは、正解ペアが 0.385〜0.857、無関係なペアの最大が
# 0.214 で、0.35 はその間に十分な余裕をもって収まっています。
cluster_threshold: 0.35

# 重なり係数が閾値を超えていても、共通する bigram がこの数に満たなければ
# 同一話題とみなさない。重なり係数は片方の見出しが極端に短いと少数の一致でも
# 1.0 に近づくため、この絶対数の下限で暴発を止めます。
min_shared_bigrams: 4

# ---------------------------------------------------------
# 既報の除外
# ---------------------------------------------------------
# 一度通知したトピックの URL を data/seen_urls.json に記録し、
# この日数だけ再通知を抑制する。
seen_ttl_days: 14

# ---------------------------------------------------------
# 要約 (Gemini)
# ---------------------------------------------------------
# 1日1リクエストで全トピックをまとめて要約する。無料枠の RPD を消費しないための措置。
# モデル名は環境変数 GEMINI_MODEL で上書きできる。
gemini_model: gemini-3.6-flash

# 1トピックあたりの要約の目安文字数(日本語)。2行程度に収まる長さ。
summary_max_chars: 120

# ---------------------------------------------------------
# 天気予報
# ---------------------------------------------------------
# ニュースとは別のメッセージとして、先頭に今日と明日の時間帯別天気を送ります。
# 天気の取得に失敗してもニュースの通知は行われます(逆も同じ)。
#
# 情報源が2つに分かれているのは、無料で取れるものが分かれているためです:
#   Open-Meteo    ... 毎時の天気・降水確率・湿度・風。キー不要・無料
#   気象庁 公式JSON ... 日最高/最低気温。キー不要・無料。地点補正済みで正確
# Open-Meteo の毎時気温は京都では公式より 3〜5℃ 低く出るため、補正はせず
# 「日最高/最低は気象庁の値」「毎時は参考値」と分けて表示します。詳しい経緯は
# src/models.py の DayForecast 周辺のコメントを参照してください。
#
# tenki.jp のスクレイピングは利用規約と著作権の観点から行いません。
weather:
  # false にすると天気の取得・通知を丸ごとスキップします。
  enabled: true

  # 通知の見出しに出す地点名。
  label: 京都市

  # Open-Meteo に渡す座標(京都地方気象台の位置)。
  # 左京区は北部が山地のため、市街地の気温を見たい場合はここを動かさないこと。
  latitude: 35.0117
  longitude: 135.7320

  # 気象庁の予報区コードと、その中の地点名。
  # 260000 は京都府。地点名は forecast JSON の areas[].area.name と一致させる。
  jma_area_code: "260000"
  jma_point_name: 京都

  # 何日ぶん通知するか(1 なら今日のみ、2 で今日と明日)。
  days: 2

  # 1行にまとめる時間数。3 なら「01-03」「04-06」…の8行になる。
  #
  # 1時間ごとに横一列で並べる表(時刻/天気/気温/降水の4行)も実装して試しましたが、
  # Discord は code block の中でも絵文字を画像として描画して等幅グリッドに乗らず、
  # 実機で桁がずれて読めませんでした。そのため時間帯ごとの縦並びに戻しています。
  # 縦並びなら行ごとに独立しているため、絵文字を使っても崩れません。
  hours_per_block: 3

  # 降水量がこの値(mm/h)以上の時間を含むブロックにだけ、降水量を表示する。
  # 降らない時間のほうが多く、0.0mm を全行に並べても情報量が無いための足切り。
  # 表示するのはブロック内の最大値。
  precip_min_display: 0.1

# ---------------------------------------------------------
# 通知
# ---------------------------------------------------------
# 全レーンで通知対象が0件だった日にも「本日は該当なし」と通知するか。
notify_when_empty: false
