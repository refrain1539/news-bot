name: collect-articles

# RSS は「直近N件」のスライディングウィンドウで配信されており、1回の取得
# だけでは数時間分の記事しか見えません(2026-09-01 の実測: Yahoo!トピックス
# 8件=1.9時間分)。朝1回の本番実行(daily.yml, 7:10 JST)だけでは、発表から
# 数時間で窓の外に流れてしまった記事を拾えないため、このワークフローで
# 3時間おきに記事だけを取得して data/article_cache.jsonl に貯めます。
#
# このワークフローは名寄せ・スコアリング・要約・通知を一切行いません。
# Discord への通知も Gemini による要約も行わないため、GEMINI_API_KEY /
# DISCORD_BOT_TOKEN 等の Secrets は渡しません(不要な権限を与えないため)。

on:
  schedule:
    # 3時間おき。分を :00 ではなく :05 にしているのは、毎時ちょうどは
    # GitHub Actions のスケジュール実行が最も混雑して遅延しやすいため。
    - cron: '5 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にするとDRY_RUNモード(保存なし)で実行します'
        required: false
        default: 'false'

permissions:
  contents: write   # data/article_cache.jsonl をcommitするため

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 記事を収集
        env:
          PYTHONUNBUFFERED: "1"
          # 手動実行時にdry_run=trueが指定された場合のみDRY_RUNモードにする
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/collect.py

      - name: キャッシュをcommit & push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/article_cache.jsonl
          git diff --quiet --cached || git commit -m "chore: collect articles $(date -u +'%Y-%m-%dT%H:%M')"
          # collect(3時間おき)と daily(朝7:10)が両方 data/ 配下へcommitするため、
          # pullせずにpushすると片方が rejected になる。rebaseで取り込んでからpushする。
          git pull --rebase origin main
          git push
