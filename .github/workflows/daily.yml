name: daily-news

# 毎朝 7:00 JST (= 22:00 UTC) に自動実行するワークフロー。
# GitHub Actions の schedule は数十分遅延することがあります(公式仕様)。
# 手動実行(workflow_dispatch)でテストする場合は、Actionsタブから
# 「Run workflow」ボタンを押してください。DRY_RUN を true にすると
# Discord通知・状態ファイル保存を行わず、ログ出力のみで動作確認できます。

on:
  # 動作確認が済んだらこの2行のコメントを外して定期実行を有効にしてください
  # schedule:
  #   - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にするとDRY_RUNモード(通知・書き込みなし)で実行します'
        required: false
        default: 'false'

permissions:
  contents: write   # data/ 配下の状態ファイルをcommitするため

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: Botを実行
        env:
          PYTHONUNBUFFERED: "1"
          # Gemini APIキー(GitHub Secretsに登録してください)
          # 未設定でも動きますが、記事の要約機能が使えなくなります
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 任意: モデル名を変更したい場合のみSecretsに登録
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # Discord通知(設定手順は docs/discord.md を参照してください)
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # 手動実行時にdry_run=trueが指定された場合のみDRY_RUNモードにする
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/main.py

      - name: 状態ファイルをcommit & push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/seen_urls.json
          git diff --quiet --cached || git commit -m "chore: update seen urls $(date -u +'%Y-%m-%d')"
          git push
