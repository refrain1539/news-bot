name: daily-news

# 毎朝 7:10 JST (= 22:10 UTC) に自動実行するワークフロー。
# GitHub Actions の schedule は数十分遅延することがあります(公式仕様)。
# 手動実行(workflow_dispatch)でテストする場合は、Actionsタブから
# 「Run workflow」ボタンを押してください。DRY_RUN を true にすると
# Discord通知・状態ファイル保存を行わず、ログ出力のみで動作確認できます。

on:
  schedule:
    # 毎朝 7:10 JST (= 22:10 UTC)。この時刻を選んだ理由:
    #
    # 1. ニュースの配信は前日の夕方〜夜に集中している。2026-08-31 の実測では
    #    総合レーンの記事の配信時刻が 18時9本 / 19時19本 / 20時17本 / 21時15本
    #    に対し、深夜1時〜6時は0本だった。つまり早朝に何時に実行しても
    #    「前日ぶん」の中身はほとんど変わらない。
    #
    # 2. 一方で Yahoo!トピックス(8本)と livedoor トピックス(20本)は
    #    アーカイブではなく「今この瞬間の主要ニュース」の入れ替え制リストで、
    #    朝の更新で朝刊・朝のニュースに差し替わる。curated_yahoo は
    #    スコアの最大の重み(3.0)なので、朝の更新後に実行したほうが
    #    その日の「主要」を正しく拾える。だから 6時ではなく 7時台にする。
    #
    # 3. 分を :00 ではなく :10 にしているのは、毎時ちょうどは GitHub Actions の
    #    スケジュール実行が最も混雑して遅延しやすいため。数十分遅れても
    #    8時前後には届く。
    #
    # 起床時刻(10時ごろ)には確実に届いている想定。もっと新しい朝のニュースを
    # 入れたい場合はこの分・時を後ろにずらす(例: '40 22 * * *' で 7:40 JST)。
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にするとDRY_RUNモード(通知・書き込みなし)で実行します'
        required: false
        default: 'false'

permissions:
  contents: write   # data/ 配下の状態ファイルをcommitするため

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: Botを実行
        env:
          PYTHONUNBUFFERED: "1"
          # Gemini APIキー(GitHub Secretsに登録してください)
          # 未設定でも動きますが、記事の要約機能が使えなくなります
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 任意: モデル名を変更したい場合のみSecretsに登録
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # Discord通知(設定手順は docs/discord.md を参照してください)
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # 手動実行時にdry_run=trueが指定された場合のみDRY_RUNモードにする
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python src/main.py

      - name: 状態ファイルをcommit & push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          # main.py は当日ぶんの取得結果を記事の蓄積にも書き戻すため、
          # seen_urls.json と article_cache.jsonl の両方をcommitする。
          git add data/seen_urls.json data/article_cache.jsonl
          git diff --quiet --cached || git commit -m "chore: update bot state $(date -u +'%Y-%m-%d')"
          # collect ワークフローが3時間おきに同じ data/ 配下へcommitするため、
          # pullせずにpushすると rejected になることがある。rebaseで取り込んでからpushする。
          git pull --rebase origin main
          git push
